    var to = "/index.html", tok = c && c.c;
    /* clients signed in before the pages were encrypted: rebuild their original link */
    if (!tok && c && c.n && c.p && c.h) {
      try { tok = btoa(unescape(encodeURIComponent(JSON.stringify({ n: c.n, p: c.p, h: c.h })))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); } catch (e) {}
    }
    if (tok) to = "/client.html?c=" + encodeURIComponent(tok);
    if (window.top !== window) { try { window.top.location.replace(to); return; } catch (e) {} }
    location.replace(to);
  }
  function locked() {
    function show() {
      document.title = "Not included · RCD Navigator";
      document.body.innerHTML = '<div style="max-width:560px;margin:4em auto;padding:28px 30px;background:#fff;border:1px solid #d8d2c4;border-left:5px solid #c8860a;border-radius:8px;font-size:15.5px;line-height:1.55">'
        + '<div style="font-weight:700;font-size:20px;margin-bottom:10px">&#128274; This tool is not part of your RCD Navigator</div>'
        + '<p style="margin:0 0 12px">Your RCD Navigator is set up for the type of boat you are building, and this tool is for a different type of boat.</p>'
        + '<p style="margin:0 0 12px">If your boat has changed, or you need this tool, please contact Blue Peter Marine at <a href="mailto:info@ceinspector.com">info@ceinspector.com</a>.</p>'
        + '<p style="margin:0;font-size:13.5px;color:#55657a">Already given access? Sign out of RCD Navigator and sign in again with your personal link.</p>'
        + '<p style="margin:16px 0 0"><a href="javascript:history.back()" style="color:#1a2e4a">&larr; Back</a></p></div>';
    }
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", show); else show();
  }
  function b64(s) {
    var bin = atob(s), u = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) u[i] = bin.charCodeAt(i);
    return u;
  }

  var client = null, stored = null;
  try { client = JSON.parse(localStorage.getItem("bpm_client") || "null"); } catch (e) {}
  try { stored = JSON.parse(localStorage.getItem("bpm_k") || "null"); } catch (e) {}
  if (!client || !client.n || (client.exp && client.exp < Date.now()) || !stored || stored.kid !== DATA.kid || !window.crypto || !crypto.subtle) {
    if (client && client.exp && client.exp < Date.now()) { try { localStorage.removeItem("bpm_client"); } catch (e) {} }
    signIn();
    return;
  }

  var groups = null, gkey = null;
  try { groups = JSON.parse(localStorage.getItem("bpm_g") || "null"); } catch (e) {}
  gkey = groups && groups.k && groups.k[DATA.g];
  if (!gkey) { locked(); return; }

  crypto.subtle.importKey("raw", b64(stored.k), "AES-GCM", false, ["decrypt"]).then(function (key) {
    function decryptBytes(buf) {
      var u = new Uint8Array(buf), kid = new TextDecoder().decode(u.subarray(8, 16));
      if (kid !== DATA.kid) return Promise.reject(new Error("key"));
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: u.subarray(16, 28) }, key, u.subarray(28));
    }
    function isEnc(buf) {
      if (buf.byteLength < 28) return false;
      return new TextDecoder().decode(new Uint8Array(buf, 0, 8)) === MAGIC;
    }
    /* same-site files (PDFs, certificate list) are stored encrypted: decrypt them on the way in */
    var origFetch = window.fetch.bind(window);
    window.fetch = function (input, init) {
      return origFetch(input, init).then(function (r) {
        var u;
        try { u = new URL(r.url || (input && input.url) || input, location.href); } catch (e) { return r; }
        if (u.origin !== location.origin || !r.ok) return r;
        return r.clone().arrayBuffer().then(function (buf) {
          if (!isEnc(buf)) return r;
          return decryptBytes(buf).then(function (plain) {
            return new Response(plain, { status: 200, statusText: "OK", headers: r.headers });
          });
        });
      });
    };
    return crypto.subtle.importKey("raw", b64(gkey), "AES-GCM", false, ["decrypt"]).then(function (k2) {
      return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(DATA.iv) }, k2, b64(DATA.ct)).catch(function () { throw new Error("group"); });
    });
  }).then(function (plain) {
    var html = new TextDecoder().decode(plain);
    function show() { document.open(); document.write(html); document.close(); }
    /* replace this loader only once it has finished loading, otherwise the page is added to it */
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { setTimeout(show, 0); });
    else setTimeout(show, 0);
  }).catch(function (err) { if (err && err.message === "group") locked(); else signIn(); });
})();
</script>
