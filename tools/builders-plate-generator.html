document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

<span style=\"display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; background: #16294f; color: #fff; border-radius: 6px; font-size: 12px;\">1<\u002Fspan>\n            Manufacturer &amp; model\n          <\u002Fh2>\n          <div style=\"display: flex; flex-direction: column; gap: 14px;\">\n            <div>\n              <label style=\"display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5b6678; margin-bottom: 6px;\">Manufacturer name / trade mark <span style=\"color: #b4471f;\">·required<\u002Fspan><\u002Flabel>\n              <input name=\"manufacturerName\" value=\"{{ manufacturerName }}\" onchange=\"{{ onChange }}\" placeholder=\"Registered name or trade mark\" style=\"width: 100%; padding: 9px 11px; border: 1px solid #cdd5e0; border-radius: 8px; font-size: 14px; color: #1a2436; background: #fff;\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5b6678; margin-bottom: 6px;\">Model name<\u002Flabel>\n              <input name=\"modelName\" value=\"{{ modelName }}\" onchange=\"{{ onChange }}\" placeholder=\"e.g. Voyager 650\" style=\"width: 100%; padding: 9px 11px; border: 1px solid #cdd5e0; border-radius: 8px; font-size: 14px; color: #1a2436; background: #fff;\">\n            <\u002Fdiv>\n            <div>\n              <label style=\"display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5b6678; margin-bottom: 6px;\">Contact address <span style=\"color: #b4471f;\">·required<\u002Fspan><\u002Flabel>\n              <textarea name=\"contactAddress\" value=\"{{ contactAddress }}\" onchange=\"{{ onChange }}\" rows=\"2\" placeholder=\"Manufacturer's contact address\" style=\"width: 100%; padding: 9px 11px; border: 1px solid #cdd5e0; border-radius: 8px; font-size: 14px; color: #1a2436; background: #fff; resize: vertical;\"><\u002Ftextarea>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- Section 2 : Conformity -->\n        <section style=\"background: #fff; border: 1px solid #dde3ec; border-radius: 13px; padding: 20px 20px 22px; box-shadow: 0 1px 2px rgba(16,41,79,.04);\">\n          <h2 style=\"margin: 0 0 16px; display: flex; align-items: center; gap: 10px; font-family: 'Saira Condensed'; font-weight: 700; font-size: 14px; letter-spacing: .13em; text-transform: uppercase; color: #16294f;\">\n            <span style=\"display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; background: #16294f; color: #fff; border-radius: 6px; font-size: 12px;\">2<\u002Fspan>\n            Conformity marking\n          <\u002Fh2>\n          <label style=\"display: flex; align-items: center; gap: 11px; cursor: pointer; margin-bottom: 14px;\">\n            <input type=\"checkbox\" name=\"ceMarking\" checked=\"{{ ceMarking }}\" onchange=\"{{ onChange }}\" style=\"width: 18px; height: 18px; accent-color: #16294f; cursor: pointer;\">\n            <span style=\"font-size: 14px; color: #1a2436; font-weight: 500;\">Display CE marking <span style=\"color: #8a93a3; font-weight: 400;\">(if applicable)<\u002Fspan><\u002Fspan>\n          <\u002Flabel>\n          <div>\n            <label style=\"display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5b6678; margin-bottom: 6px;\">Notified body number <span style=\"color: #8a93a3; font-weight: 500;\">(if involved in production control)<\u002Fspan><\u002Flabel>\n            <input name=\"notifiedBodyNumber\" value=\"{{ notifiedBodyNumber }}\" onchange=\"{{ onChange }}\" placeholder=\"e.g. 0123\" style=\"width: 140px; padding: 9px 11px; border: 1px solid #cdd5e0; border-radius: 8px; font-size: 14px; color: #1a2436; background: #fff;\">\n          <\u002Fdiv>\n        <\u002Fsection>\n\n        <!-- Section 3 : Design category & capacities -->\n        <section style=\"background: #fff; border: 1px solid #dde3ec; border-radius: 13px; padding: 20px 20px 22px; box-shadow: 0 1px 2px rgba(16,41,79,.04);\">\n          <h2 style=\"margin: 0 0 6px; display: flex; align-items: center; gap: 10px; font-family: 'Saira Condensed'; font-weight: 700; font-size: 14px; letter-spacing: .13em; text-transform: uppercase; color: #16294f;\">\n            <span style=\"display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; background: #16294f; color: #fff; border-radius: 6px; font-size: 12px;\">3<\u002Fspan>\n            Design category &amp; capacities\n          <\u002Fh2>\n          <p style=\"margin: 0 0 14px; font-size: 12px; color: #7a838f; line-height: 1.5;\">Select each design category (ISO 12217) the craft is assessed for. Max persons &amp; max load follow ISO 14946.<\u002Fp>\n\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px;\">\n            <label style=\"display: flex; align-items: center; gap: 9px; padding: 9px 11px; border: 1px solid #d7dde7; border-radius: 8px; cursor: pointer;\">\n              <input type=\"checkbox\" data-cat=\"A\" checked=\"{{ categories.A }}\" onchange=\"{{ toggleCat }}\" style=\"width: 17px; height: 17px; accent-color: #16294f; cursor: pointer;\">\n              <span style=\"font-size: 13.5px; color: #1a2436;\"><b style=\"font-family: 'Saira Condensed'; font-size: 16px;\">A<\u002Fb><\u002Fspan>\n            <\u002Flabel>\n            <label style=\"display: flex; align-items: center; gap: 9px; padding: 9px 11px; border: 1px solid #d7dde7; border-radius: 8px; cursor: pointer;\">\n              <input type=\"checkbox\" data-cat=\"B\" checked=\"{{ categories.B }}\" onchange=\"{{ toggleCat }}\" style=\"width: 17px; height: 17px; accent-color: #16294f; cursor: pointer;\">\n              <span style=\"font-size: 13.5px; color: #1a2436;\"><b style=\"font-family: 'Saira Condensed'; font-size: 16px;\">B<\u002Fb><\u002Fspan>\n            <\u002Flabel>\n            <label style=\"display: flex; align-items: center; gap: 9px; padding: 9px 11px; border: 1px solid #d7dde7; border-radius: 8px; cursor: pointer;\">\n              <input type=\"checkbox\" data-cat=\"C\" checked=\"{{ categories.C }}\" onchange=\"{{ toggleCat }}\" style=\"width: 17px; height: 17px; accent-color: #16294f; cursor: pointer;\">\n              <span style=\"font-size: 13.5px; color: #1a2436;\"><b style=\"font-family: 'Saira Condensed'; font-size: 16px;\">C<\u002Fb><\u002Fspan>\n            <\u002Flabel>\n            <label style=\"display: flex; align-items: center; gap: 9px; padding: 9px 11px; border: 1px solid #d7dde7; border-radius: 8px; cursor: pointer;\">\n              <input type=\"checkbox\" data-cat=\"D\" checked=\"{{ categories.D }}\" onchange=\"{{ toggleCat }}\" style=\"width: 17px; height: 17px; accent-color: #16294f; cursor: pointer;\">\n              <span style=\"font-size: 13.5px; color: #1a2436;\"><b style=\"font-family: 'Saira Condensed'; font-size: 16px;\">D<\u002Fb><\u002Fspan>\n            <\u002Flabel>\n          <\u002Fdiv>\n\n          <sc-for list=\"{{ selectedCategories }}\" as=\"cat\" hint-placeholder-count=\"1\">\n            <div style=\"margin-top: 12px; padding: 13px 14px; background: #f4f7fb; border: 1px solid #dde6f1; border-radius: 9px;\">\n              <div style=\"font-family: 'Saira Condensed'; font-weight: 700; font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: #2e63b0; margin-bottom: 10px;\">Category {{ cat.code }}<\u002Fdiv>\n              <div style=\"display: flex; gap: 12px;\">\n                <div style=\"flex: 1;\">\n                  <label style=\"display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #5b6678; margin-bottom: 5px;\">Max. persons<\u002Flabel>\n                  <input type=\"number\" min=\"1\" data-cat=\"{{ cat.key }}\" data-field=\"persons\" value=\"{{ cat.personsRaw }}\" onchange=\"{{ onCapChange }}\" style=\"width: 100%; padding: 8px 10px; border: 1px solid #cdd5e0; border-radius: 7px; font-size: 14px; color: #1a2436; background: #fff;\">\n                <\u002Fdiv>\n                <div style=\"flex: 1;\">\n                  <label style=\"display: block; font-size: 10.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #5b6678; margin-bottom: 5px;\">Max. load (kg)<\u002Flabel>\n                  <input type=\"number\" min=\"0\" data-cat=\"{{ cat.key }}\" data-field=\"load\" value=\"{{ cat.loadRaw }}\" onchange=\"{{ onCapChange }}\" style=\"width: 100%; padding: 8px 10px; border: 1px solid #cdd5e0; border-radius: 7px; font-size: 14px; color: #1a2436; background: #fff;\">\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <sc-if value=\"{{ multiCategory }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin: 12px 0 0; font-size: 11.5px; color: #2e63b0; line-height: 1.5;\">Multiple categories selected — the plate shows persons &amp; load per category so each is clearly identified (ISO 14945, 5.2).<\u002Fp>\n          <\u002Fsc-if>\n          <sc-if value=\"{{ noCategory }}\" hint-placeholder-val=\"{{ false }}\">\n            <p style=\"margin: 12px 0 0; font-size: 11.5px; color: #b4471f; line-height: 1.5;\">Select at least one design category — it is required information (5.1 c).<\u002Fp>\n          <\u002Fsc-if>\n        <\u002Fsection>\n\n        <!-- Section 4 : Propulsion (optional) -->\n        <section style=\"background: #fff; border: 1px solid #dde3ec; border-radius: 13px; padding: 20px 20px 22px; box-shadow: 0 1px 2px rgba(16,41,79,.04);\">\n          <h2 style=\"margin: 0 0 6px; display: flex; align-items: center; gap: 10px; font-family: 'Saira Condensed'; font-weight: 700; font-size: 14px; letter-spacing: .13em; text-transform: uppercase; color: #16294f;\">\n            <span style=\"display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; background: #16294f; color: #fff; border-radius: 6px; font-size: 12px;\">4<\u002Fspan>\n            Propulsion <span style=\"font-weight: 500; color: #8a93a3; letter-spacing: .04em; text-transform: none; font-family: 'Saira';\">— optional<\u002Fspan>\n          <\u002Fh2>\n          <p style=\"margin: 0 0 14px; font-size: 12px; color: #7a838f; line-height: 1.5;\">Optional info is separated from required info on the plate by a divider (5.3).<\u002Fp>\n\n          <label style=\"display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5b6678; margin-bottom: 6px;\">Propulsion type<\u002Flabel>\n          <select name=\"propulsion\" value=\"{{ propulsion }}\" onchange=\"{{ onChange }}\" style=\"width: 100%; padding: 9px 11px; border: 1px solid #cdd5e0; border-radius: 8px; font-size: 14px; color: #1a2436; background: #fff; margin-bottom: 16px;\">\n            <option value=\"inboard\">Inboard / sterndrive<\u002Foption>\n            <option value=\"outboard\">Outboard engine(s)<\u002Foption>\n          <\u002Fselect>\n\n          <label style=\"display: flex; align-items: center; gap: 11px; cursor: pointer; margin-bottom: 10px;\">\n            <input type=\"checkbox\" name=\"showPower\" checked=\"{{ showPower }}\" onchange=\"{{ onChange }}\" style=\"width: 18px; height: 18px; accent-color: #16294f; cursor: pointer;\">\n            <span style=\"font-size: 14px; color: #1a2436; font-weight: 500;\">Include max. power rating (kW)<\u002Fspan>\n          <\u002Flabel>\n          <sc-if value=\"{{ showPower }}\" hint-placeholder-val=\"{{ true }}\">\n            <input type=\"number\" min=\"0\" step=\"0.1\" name=\"maxPower\" value=\"{{ maxPower }}\" onchange=\"{{ onChange }}\" placeholder=\"kW\" style=\"width: 140px; padding: 9px 11px; border: 1px solid #cdd5e0; border-radius: 8px; font-size: 14px; color: #1a2436; background: #fff; margin-bottom: 16px;\">\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ propulsionIsOutboard }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"border-top: 1px dashed #dde3ec; padding-top: 14px;\">\n              <label style=\"display: flex; align-items: center; gap: 11px; cursor: pointer; margin-bottom: 10px;\">\n                <input type=\"checkbox\" name=\"showOutboardMass\" checked=\"{{ showOutboardMass }}\" onchange=\"{{ onChange }}\" style=\"width: 18px; height: 18px; accent-color: #16294f; cursor: pointer;\">\n                <span style=\"font-size: 14px; color: #1a2436; font-weight: 500;\">Include max. outboard mass (kg)<\u002Fspan>\n              <\u002Flabel>\n              <sc-if value=\"{{ showOutboardMass }}\" hint-placeholder-val=\"{{ true }}\">\n                <input type=\"number\" min=\"0\" name=\"maxOutboardMass\" value=\"{{ maxOutboardMass }}\" onchange=\"{{ onChange }}\" placeholder=\"kg\" style=\"width: 140px; padding: 9px 11px; border: 1px solid #cdd5e0; border-radius: 8px; font-size: 14px; color: #1a2436; background: #fff;\">\n                <p style=\"margin: 9px 0 0; font-size: 11.5px; color: #7a838f; line-height: 1.5;\">Required for outboard engines greater than 3 kW (Annex A, Figure A.2).<\u002Fp>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsection>\n\n        <!-- Section 5 : Inflatable -->\n        <section style=\"background: #fff; border: 1px solid #dde3ec; border-radius: 13px; padding: 20px 20px 22px; box-shadow: 0 1px 2px rgba(16,41,79,.04);\">\n          <h2 style=\"margin: 0 0 14px; display: flex; align-items: center; gap: 10px; font-family: 'Saira Condensed'; font-weight: 700; font-size: 14px; letter-spacing: .13em; text-transform: uppercase; color: #16294f;\">\n            <span style=\"display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; background: #16294f; color: #fff; border-radius: 6px; font-size: 12px;\">5<\u002Fspan>\n            Inflatable craft\n          <\u002Fh2>\n          <label style=\"display: flex; align-items: center; gap: 11px; cursor: pointer; margin-bottom: 14px;\">\n            <input type=\"checkbox\" name=\"isInflatable\" checked=\"{{ isInflatable }}\" onchange=\"{{ onChange }}\" style=\"width: 18px; height: 18px; accent-color: #16294f; cursor: pointer;\">\n            <span style=\"font-size: 14px; color: #1a2436; font-weight: 500;\">This is an inflatable craft<\u002Fspan>\n          <\u002Flabel>\n\n          <div style=\"display: flex; gap: 12px; align-items: flex-start; padding: 12px 13px; background: #fdf3ec; border: 1px solid #f0d3bf; border-radius: 9px; margin-bottom: 16px;\">\n            <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#b4471f\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink: 0; margin-top: 1px;\"><path d=\"M12 9v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><path d=\"M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z\"><\u002Fpath><\u002Fsvg>\n            <p style=\"margin: 0; font-size: 12.5px; color: #8a4220; line-height: 1.55;\"><b>Note —<\u002Fb> For inflatable craft, the <b>nominal pressure<\u002Fb> of the buoyancy tubes must also be indicated on the builder's plate.<\u002Fp>\n          <\u002Fdiv>\n\n          <sc-if value=\"{{ isInflatable }}\" hint-placeholder-val=\"{{ false }}\">\n            <div>\n              <label style=\"display: block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: #5b6678; margin-bottom: 6px;\">Nominal pressure <span style=\"color: #b4471f;\">·required for inflatables<\u002Fspan><\u002Flabel>\n              <div style=\"display: flex; gap: 10px;\">\n                <input type=\"number\" min=\"0\" step=\"0.01\" name=\"nominalPressure\" value=\"{{ nominalPressure }}\" onchange=\"{{ onChange }}\" placeholder=\"e.g. 0.25\" style=\"width: 140px; padding: 9px 11px; border: 1px solid #cdd5e0; border-radius: 8px; font-size: 14px; color: #1a2436; background: #fff;\">\n                <select name=\"pressureUnit\" value=\"{{ pressureUnit }}\" onchange=\"{{ onChange }}\" style=\"padding: 9px 11px; border: 1px solid #cdd5e0; border-radius: 8px; font-size: 14px; color: #1a2436; background: #fff;\">\n                  <option value=\"bar\">bar<\u002Foption>\n                  <option value=\"mbar\">mbar<\u002Foption>\n                  <option value=\"kPa\">kPa<\u002Foption>\n                  <option value=\"psi\">psi<\u002Foption>\n                <\u002Fselect>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fsection>\n\n        <!-- Reference footnote -->\n        <div style=\"padding: 16px 18px; background: #eef2f8; border: 1px solid #dde3ec; border-radius: 11px;\">\n          <div style=\"font-family: 'Saira Condensed'; font-weight: 700; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: #16294f; margin-bottom: 8px;\">Plate manufacture — ISO 14945 requirements<\u002Fdiv>\n          <ul style=\"margin: 0; padding-left: 16px; font-size: 12px; color: #5f6a78; line-height: 1.65;\">\n            <li>Required characters ≥ 5 mm high; other characters ≥ 3 mm (4.3).<\u002Fli>\n            <li>Pictograms &amp; symbols ≥ 8 mm high (4.4).<\u002Fli>\n            <li>Permanently affixed; readily visible near the main steering position; separate from the craft identification number (4.1, 4.5).<\u002Fli>\n            <li>UV- and fade-resistant; markings contrast with the background (4.2).<\u002Fli>\n          <\u002Ful>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- ===================== PREVIEW ===================== -->\n      <div style=\"flex: 1 1 460px; min-width: 360px; position: sticky; top: 28px; align-self: flex-start;\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px;\">\n          <span style=\"font-family: 'Saira Condensed'; font-weight: 700; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: #6c7785;\">Live plate preview<\u002Fspan>\n          <span style=\"font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: #9aa3b0;\">Layout illustrative<\u002Fspan>\n        <\u002Fdiv>\n\n        <!-- THE PLATE -->\n        <div id=\"plate-card\" style=\"position: relative; width: 100%; max-width: 500px; margin: 0 auto; padding: 30px 30px 28px; border-radius: 9px; border: 3px solid #16294f; color: #16294f; background-image: repeating-linear-gradient(180deg, rgba(255,255,255,.45) 0px, rgba(255,255,255,0) 2px, rgba(22,41,79,.025) 3px), linear-gradient(135deg, #f7f9fc 0%, #d9e0ea 52%, #eef2f7 100%); box-shadow: inset 0 0 0 2px rgba(255,255,255,.55), inset 0 0 22px rgba(22,41,79,.06), 0 22px 46px -18px rgba(16,41,79,.5);\">\n\n          <!-- corner screws -->\n          <span style=\"position: absolute; top: 9px; left: 9px; width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fdfefe, #aab4c2 70%, #7d8895); box-shadow: inset 0 0 0 1px rgba(22,41,79,.25);\"><\u002Fspan>\n          <span style=\"position: absolute; top: 9px; right: 9px; width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fdfefe, #aab4c2 70%, #7d8895); box-shadow: inset 0 0 0 1px rgba(22,41,79,.25);\"><\u002Fspan>\n          <span style=\"position: absolute; bottom: 9px; left: 9px; width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fdfefe, #aab4c2 70%, #7d8895); box-shadow: inset 0 0 0 1px rgba(22,41,79,.25);\"><\u002Fspan>\n          <span style=\"position: absolute; bottom: 9px; right: 9px; width: 11px; height: 11px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fdfefe, #aab4c2 70%, #7d8895); box-shadow: inset 0 0 0 1px rgba(22,41,79,.25);\"><\u002Fspan>\n\n          <!-- header: name + CE -->\n          <div style=\"display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;\">\n            <div style=\"min-width: 0;\">\n              <div style=\"font-family: 'Saira Condensed'; font-weight: 800; font-size: 27px; line-height: 1.05; letter-spacing: .01em; text-transform: uppercase; word-break: break-word;\">{{ manufacturerName }}<\u002Fdiv>\n              <sc-if value=\"{{ modelName }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"font-family: 'Saira Semi Condensed'; font-weight: 700; font-size: 15px; letter-spacing: .04em; color: #2e63b0; margin-top: 2px; text-transform: uppercase;\">{{ modelName }}<\u002Fdiv>\n              <\u002Fsc-if>\n              <div style=\"font-size: 11.5px; line-height: 1.4; color: #3c4a63; margin-top: 6px; white-space: pre-line; max-width: 280px;\">{{ contactAddress }}<\u002Fdiv>\n            <\u002Fdiv>\n            <sc-if value=\"{{ ceMarking }}\" hint-placeholder-val=\"{{ true }}\">\n              <div style=\"text-align: center; flex-shrink: 0;\">\n                <img src=\"defc0043-1a6a-4aff-91c0-03ca8716a61f\" alt=\"CE marking\" style=\"height: 40px; width: auto; display: block;\">\n                <sc-if value=\"{{ showNB }}\" hint-placeholder-val=\"{{ true }}\">\n                  <div style=\"font-family: 'Saira Condensed'; font-weight: 700; font-size: 15px; letter-spacing: .06em; margin-top: 2px;\">{{ notifiedBodyNumber }}<\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n\n          <div style=\"height: 2px; background: linear-gradient(90deg, #16294f, rgba(22,41,79,.15)); margin: 16px 0 4px; border-radius: 2px;\"><\u002Fdiv>\n\n          <!-- categories + capacities -->\n          <sc-if value=\"{{ noCategory }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"margin: 10px 0; padding: 16px; border: 1.5px dashed #9fadc4; border-radius: 8px; text-align: center; font-size: 12.5px; color: #6c7785; letter-spacing: .04em;\">Select a design category to populate the plate<\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-for list=\"{{ selectedCategories }}\" as=\"cat\" hint-placeholder-count=\"1\">\n            <div style=\"margin-top: 14px;\">\n              <div style=\"display: flex; align-items: center; gap: 10px; margin-bottom: 10px;\">\n                <span style=\"display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 34px; padding: 0 8px; background: #16294f; color: #fff; font-family: 'Saira Condensed'; font-weight: 800; font-size: 22px; border-radius: 6px;\">{{ cat.code }}<\u002Fspan>\n                <span style=\"font-family: 'Saira Semi Condensed'; font-weight: 700; font-size: 14px; letter-spacing: .1em; text-transform: uppercase; color: #16294f;\">Design category {{ cat.code }}<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"display: flex; gap: 14px;\">\n                <div style=\"flex: 1; display: flex; align-items: center; gap: 11px; padding: 11px 14px; background: rgba(255,255,255,.55); border: 1px solid rgba(22,41,79,.18); border-radius: 8px;\">\n                  <svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"#16294f\"><circle cx=\"12\" cy=\"6\" r=\"3.4\"><\u002Fcircle><path d=\"M12 10.2c-3.3 0-5.4 2.2-5.9 6.2L5.7 20h12.6l-.4-3.6c-.5-4-2.6-6.2-5.9-6.2z\"><\u002Fpath><\u002Fsvg>\n                  <div>\n                    <div style=\"font-family: 'Saira Condensed'; font-weight: 800; font-size: 26px; line-height: 1;\">{{ cat.persons }}<\u002Fdiv>\n                    <div style=\"font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #51607a;\">Max. persons<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"flex: 1.25; display: flex; align-items: center; gap: 8px; padding: 11px 14px; background: rgba(255,255,255,.55); border: 1px solid rgba(22,41,79,.18); border-radius: 8px;\">\n                  <svg width=\"28\" height=\"28\" viewBox=\"0 0 24 24\" fill=\"#16294f\"><circle cx=\"9\" cy=\"6\" r=\"3\"><\u002Fcircle><path d=\"M9 9.6c-2.9 0-4.7 2-5.2 5.5L3.4 18h11.2l-.4-2.9c-.5-3.5-2.3-5.5-5.2-5.5z\"><\u002Fpath><\u002Fsvg>\n                  <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"#16294f\" style=\"flex-shrink:0;\"><rect x=\"10\" y=\"3\" width=\"4\" height=\"18\"><\u002Frect><rect x=\"3\" y=\"10\" width=\"18\" height=\"4\"><\u002Frect><\u002Fsvg>\n                  <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"#16294f\"><path d=\"M9.2 7V5.6c0-.9.7-1.6 1.6-1.6h2.4c.9 0 1.6.7 1.6 1.6V7h-1.6V5.6h-2.4V7H9.2z\"><\u002Fpath><rect x=\"3.5\" y=\"7.6\" width=\"17\" height=\"11.4\" rx=\"1.6\"><\u002Frect><\u002Fsvg>\n                  <div>\n                    <div style=\"font-family: 'Saira Condensed'; font-weight: 800; font-size: 26px; line-height: 1;\">{{ cat.load }} <span style=\"font-size: 15px; font-weight: 700;\">kg<\u002Fspan><\u002Fdiv>\n                    <div style=\"font-size: 10px; letter-spacing: .12em; text-transform: uppercase; color: #51607a;\">Max. load<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n\n          <!-- optional info -->\n          <sc-if value=\"{{ showOptionalSection }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"border-top: 2px dashed rgba(22,41,79,.35); margin-top: 16px; padding-top: 14px; display: flex; gap: 14px;\">\n              <sc-if value=\"{{ showPowerRow }}\" hint-placeholder-val=\"{{ true }}\">\n                <div style=\"flex: 1; display: flex; align-items: center; gap: 11px;\">\n                  <svg width=\"32\" height=\"32\" viewBox=\"0 0 24 24\" fill=\"#16294f\"><ellipse cx=\"12\" cy=\"6.6\" rx=\"2.3\" ry=\"4.7\"><\u002Fellipse><ellipse cx=\"12\" cy=\"6.6\" rx=\"2.3\" ry=\"4.7\" transform=\"rotate(120 12 12)\"><\u002Fellipse><ellipse cx=\"12\" cy=\"6.6\" rx=\"2.3\" ry=\"4.7\" transform=\"rotate(240 12 12)\"><\u002Fellipse><circle cx=\"12\" cy=\"12\" r=\"2.5\"><\u002Fcircle><circle cx=\"12\" cy=\"12\" r=\"1\" fill=\"#dbe2ec\"><\u002Fcircle><\u002Fsvg>\n                  <div>\n                    <div style=\"font-family: 'Saira Condensed'; font-weight: 800; font-size: 23px; line-height: 1;\">{{ maxPower }} <span style=\"font-size: 14px; font-weight: 700;\">kW<\u002Fspan><\u002Fdiv>\n                    <div style=\"font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: #51607a;\">{{ powerLabel }}<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ showOutboardRow }}\" hint-placeholder-val=\"{{ false }}\">\n                <div style=\"flex: 1; display: flex; align-items: center; gap: 11px;\">\n                  <img src=\"2cee654d-69e5-4803-880e-808e43ab105e\" alt=\"Outboard engine\" style=\"height: 36px; width: auto; display: block;\">\n                  <div>\n                    <div style=\"font-family: 'Saira Condensed'; font-weight: 800; font-size: 23px; line-height: 1;\">{{ maxOutboardMass }} <span style=\"font-size: 14px; font-weight: 700;\">kg<\u002Fspan><\u002Fdiv>\n                    <div style=\"font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: #51607a;\">Max. outboard mass<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fdiv>\n              <\u002Fsc-if>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <!-- inflatable nominal pressure -->\n          <sc-if value=\"{{ showInflatableRow }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"border-top: 2px dashed rgba(22,41,79,.35); margin-top: 16px; padding-top: 14px; display: flex; align-items: center; gap: 11px;\">\n              <svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#16294f\" stroke-width=\"1.7\"><circle cx=\"12\" cy=\"12\" r=\"9\"><\u002Fcircle><path d=\"M12 12 12 5.5\" stroke-linecap=\"round\" stroke-width=\"2\"><\u002Fpath><circle cx=\"12\" cy=\"12\" r=\"1.6\" fill=\"#16294f\" stroke=\"none\"><\u002Fcircle><path d=\"M16.5 8.2 14 10.6\" stroke-linecap=\"round\"><\u002Fpath><\u002Fsvg>\n              <div>\n                <div style=\"font-family: 'Saira Condensed'; font-weight: 800; font-size: 23px; line-height: 1;\">{{ pressureDisplay }}<\u002Fdiv>\n                <div style=\"font-size: 9.5px; letter-spacing: .1em; text-transform: uppercase; color: #51607a;\">Nominal pressure · buoyancy tubes<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n        <\u002Fdiv>\n\n        <p style=\"max-width: 500px; margin: 16px auto 0; font-size: 11.5px; color: #8893a3; line-height: 1.55; text-align: center;\">On the physical plate, required characters must be ≥ 5 mm and pictograms ≥ 8 mm high (ISO 14945, 4.3–4.4).<\u002Fp>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fmain>\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    manufacturerName: 'Blue Peter Marine',\n    modelName: 'Voyager 650',\n    contactAddress: '12 Harbour Road, Cape Town 8001, South Africa',\n    ceMarking: true,\n    notifiedBodyNumber: '0609',\n    propulsion: 'outboard',\n    categories: { A: false, B: false, C: true, D: false },\n    capacities: {\n      A: { persons: '', load: '' },\n      B: { persons: '', load: '' },\n      C: { persons: '6', load: '650' },\n      D: { persons: '', load: '' },\n    },\n    showPower: true,\n    maxPower: '60',\n    showOutboardMass: true,\n    maxOutboardMass: '180',\n    isInflatable: false,\n    nominalPressure: '0.25',\n    pressureUnit: 'bar',\n  };\n\n  onChange = (e) => {\n    const t = e.target;\n    const val = t.type === 'checkbox' ? t.checked : t.value;\n    this.setState({ [t.name]: val });\n  };\n\n  toggleCat = (e) => {\n    const cat = e.target.dataset.cat;\n    const on = e.target.checked;\n    this.setState((s) => ({ categories: { ...s.categories, [cat]: on } }));\n  };\n\n  onCapChange = (e) => {\n    const { cat, field } = e.target.dataset;\n    const val = e.target.value;\n    this.setState((s) => ({\n      capacities: { ...s.capacities, [cat]: { ...s.capacities[cat], [field]: val } },\n    }));\n  };\n\n  doPrint = () => { window.print(); };\n\n  renderVals() {\n    const s = this.state;\n    const names = { A: 'Ocean', B: 'Offshore', C: 'Inshore', D: 'Sheltered waters' };\n    const order = ['A', 'B', 'C', 'D'];\n    const selectedCategories = order\n      .filter((k) => s.categories[k])\n      .map((k) => ({\n        key: k,\n        code: k,\n        name: names[k],\n        nameUpper: names[k].toUpperCase(),\n        personsRaw: s.capacities[k].persons,\n        loadRaw: s.capacities[k].load,\n        persons: s.capacities[k].persons || '—',\n        load: s.capacities[k].load || '—',\n      }));\n\n    const propulsionIsOutboard = s.propulsion === 'outboard';\n    const showPowerRow = !!(s.showPower && String(s.maxPower).trim());\n    const showOutboardRow = !!(propulsionIsOutboard && s.showOutboardMass && String(s.maxOutboardMass).trim());\n    const showInflatableRow = !!(s.isInflatable && String(s.nominalPressure).trim());\n\n    return {\n      ...s,\n      selectedCategories,\n      noCategory: selectedCategories.length === 0,\n      multiCategory: selectedCategories.length > 1,\n      showNB: !!(s.ceMarking && String(s.notifiedBodyNumber).trim()),\n      propulsionIsOutboard,\n      showPowerRow,\n      showOutboardRow,\n      showOptionalSection: showPowerRow || showOutboardRow,\n      showInflatableRow,\n      pressureDisplay: `${s.nominalPressure} ${s.pressureUnit}`,\n      powerLabel: propulsionIsOutboard ? 'Max. outboard power' : 'Max. power rating',\n      onChange: this.onChange,\n      toggleCat: this.toggleCat,\n      onCapChange: this.onCapChange,\n      doPrint: this.doPrint,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
