    window.fetch = function (input, init) {
      return origFetch(input, init).then(function (r) {
        var u;
        try { u = new URL(r.url || (input && input.url) || input, location.href); } catch (e) { return r; }
        if (u.origin !== location.origin || !r.ok) return r;
        return r.clone().arrayBuffer().then(function (buf) {
          if (!isEnc(buf)) return r;
          return decryptBytes(buf).then(function (plain) {
            return new Response(plain, { status: 200, statusText: "OK", headers: r.headers });
          });
        });
      });
    };
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(DATA.iv) }, key, b64(DATA.ct));
  }).then(function (plain) {
    var html = new TextDecoder().decode(plain);
    function show() { document.open(); document.write(html); document.close(); }
    /* replace this loader only once it has finished loading, otherwise the page is added to it */
    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", function () { setTimeout(show, 0); });
    else setTimeout(show, 0);
  }).catch(function () { signIn(); });
})();
</script>
